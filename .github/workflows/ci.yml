name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate baseprompt version
        run: bash scripts/validate-baseprompt-version.sh

      - name: Check baseprompt version bump (PR only)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-baseprompt-version-bump.sh origin/${{ github.base_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: mcp-server

      - name: Build TypeScript
        run: bun run build:ts
        working-directory: mcp-server

      - name: Run tests
        run: bun test
        working-directory: mcp-server

      - name: Build Swift CLI
        run: swift build -c release
        working-directory: dialog-cli

      # The one suite that can assert on what a dialog looks like, and the
      # only one that runs unattended: it parks every window off-display and
      # measures the view tree and the bitmap, so it needs no screen, no
      # keyboard and no Screen Recording grant. Until this step existed, a
      # clipped dialog, an overlapping control or text that did not fit its
      # box reached main with a green check.
      #
      # The suites that spawn real dialogs — test:visual, test:keyboard —
      # cannot run on a hosted runner and are not attempted here. They run in
      # the container: see container/README.md.
      - name: Layout audit
        run: bun run test:layout
